# Optional observability overlay. Run it with the production compose file:
#
#   docker compose --project-directory . \
#     -f deploy/compose.prod.yml -f deploy/compose.observability.yml \
#     --env-file .env up -d prometheus grafana
#
# Both UIs bind to loopback only; use an SSH tunnel or an authenticated reverse
# proxy. The API and worker metrics endpoints stay on the private network.
services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.1.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
      - prometheusdata:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    depends_on: [api, worker]
    networks: [app_net]
    restart: always
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3001:3000"]
    depends_on: [prometheus]
    networks: [app_net]
    restart: always
    security_opt: ["no-new-privileges:true"]
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

volumes:
  prometheusdata:
  grafanadata:
