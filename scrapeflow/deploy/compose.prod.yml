name: scrapeflow-prod

x-backend: &backend
  image: ${SCRAPEFLOW_IMAGE:-scrapeflow:latest}
  env_file: .env
  environment:
    SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    EGRESS_PROXY_URL: http://egress-proxy:8888
    ARTIFACTS_ENDPOINT: http://minio:9000
    ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:?set ARTIFACTS_BUCKET}
    ARTIFACTS_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
    ARTIFACTS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  restart: always
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [app_net]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  api:
    <<: *backend
    command: ["uvicorn", "apps.api.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--proxy-headers", "--forwarded-allow-ips=*"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    expose: ["8000"]
    mem_limit: 1g
    cpus: 2.0

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_APP_NAME: ScrapeFlow
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    expose: ["3000"]
    restart: always
    networks: [app_net]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 512m
    cpus: 1.0
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  worker:
    <<: *backend
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=8", "--max-tasks-per-child=100", "--queues=jobs,celery"]
    # Per-job upstream proxies use a worker-local validating proxy that Grid
    # must reach. Set the advertised host to a DNS name that resolves from the
    # Grid container (the compose service name by default).
    environment:
      EGRESS_JOB_PROXY_BIND_HOST: 0.0.0.0
      EGRESS_JOB_PROXY_ADVERTISE_HOST: ${EGRESS_JOB_PROXY_ADVERTISE_HOST:-worker}
      # Celery prefork children share counters through this directory.
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      WORKER_METRICS_ENABLED: "true"
    expose: ["9101"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    mem_limit: 2g
    cpus: 4.0
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: ["celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      disable: true

  egress-proxy:
    <<: *backend
    command: ["python", "-m", "apps.worker.egress_proxy"]
    environment:
      EGRESS_PROXY_LISTEN_HOST: 0.0.0.0
      EGRESS_PROXY_LISTEN_PORT: "8888"
      EGRESS_ALLOWED_PORTS: "80,443"
    expose: ["8888"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      disable: true

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]
    restart: always

  minio-init:
    <<: *backend
    command: ["python", "scripts/ensure_bucket.py"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]
    restart: always

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]
    restart: always

  selenium:
    image: selenium/standalone-chrome:4.25.0
    shm_size: 2g
    environment:
      SE_NODE_MAX_SESSIONS: "8"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: "300"
      SE_START_XVFB: "false"
      SE_START_VNC: "false"
    mem_limit: 6g
    security_opt: ["no-new-privileges:true"]
    networks: [app_net]
    restart: always

  caddy:
    image: caddy:2.8-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, web]
    networks: [app_net]
    restart: always

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddy_data:
  caddy_config:

networks:
  app_net:
    driver: bridge
