[project]
name = "scrapeflow"
version = "0.1.0"
description = "Multi-tenant web scraping and browser automation API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14,<2",
    "argon2-cffi>=23.1,<26",
    "asyncpg>=0.30,<1",
    "boto3>=1.35,<2",
    "celery[redis]>=5.4,<6",
    "croniter>=3.0,<7",
    "cryptography>=50,<51",
    "email-validator>=2.2,<3",
    "fastapi>=0.162,<0.163",
    "httpx>=0.27,<1",
    "parsel>=1.9,<2",
    "prometheus-client>=0.20,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.5,<3",
    "PyJWT>=2.9,<3",
    "redis>=5.2,<7",
    "selenium>=4.25,<5",
    "sentry-sdk[fastapi]>=2.14,<3",
    "sqlalchemy[asyncio]>=2.0.35,<2.1",
    "starlette>=1.10,<2",
    "stripe>=11,<15",
    "structlog>=24.4,<26",
    "uvicorn[standard]>=0.32,<0.33",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2",
    "pip-audit>=2.7,<3",
    "pytest>=9.0.3,<10",
    "pytest-asyncio>=1.0,<2",
    "pytest-cov>=5,<8",
    "respx>=0.21,<1",
    "ruff>=0.7,<1",
]
e2e = [
    "locust>=2.32,<3",
]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps", "packages", "tests"]
exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # asserts are expected in tests
    "S105",   # false positives on token *names*
    "S106",
    "B008",   # FastAPI Depends/Query defaults are idiomatic
    "RUF012", # ClassVar annotations handled case by case
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"migrations/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
show_error_codes = true
exclude = ["migrations/versions"]

[[tool.mypy.overrides]]
module = ["asyncpg", "boto3.*", "botocore.*", "celery.*", "croniter.*", "stripe.*", "locust.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs Postgres/Redis (testcontainers or TEST_* env)",
    "browser: needs Chrome/Selenium",
    "e2e: full stack",
]

[tool.coverage.run]
branch = true
source = ["apps", "packages"]
omit = ["*/celery_app.py"]
# SQLAlchemy async sessions execute sync database work in greenlets; without
# this, coverage misses statements around awaited session calls.
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70
