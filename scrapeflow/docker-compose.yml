name: scrapeflow

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  env_file: .env
  environment:
    SELENIUM_REMOTE_URL: http://selenium:4444/wd/hub
    EGRESS_PROXY_URL: http://egress-proxy:8888
    ARTIFACTS_ENDPOINT: http://minio:9000
    ARTIFACTS_BUCKET: ${ARTIFACTS_BUCKET:-scrapeflow}
    ARTIFACTS_ACCESS_KEY: ${MINIO_ROOT_USER:-scrapeflow}
    ARTIFACTS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-scrapeflow-dev-secret}
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks: [app_net]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true
  tmpfs: ["/tmp:size=256m,mode=1777"]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scrapeflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scrapeflow}
      POSTGRES_DB: ${POSTGRES_DB:-scrapeflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scrapeflow} -d ${POSTGRES_DB:-scrapeflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [app_net]

  api:
    <<: *backend
    command: ["uvicorn", "apps.api.asgi:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
    mem_limit: 512m
    cpus: 1.0

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    healthcheck:
      disable: true

  worker:
    <<: *backend
    command: ["celery", "-A", "apps.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=4", "--queues=jobs,celery"]
    # Per-job upstream proxies are applied by a worker-local validating proxy.
    # Grid must be able to reach it, so bind on the container interface and
    # advertise the compose service name rather than loopback.
    environment:
      EGRESS_JOB_PROXY_BIND_HOST: 0.0.0.0
      EGRESS_JOB_PROXY_ADVERTISE_HOST: worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    mem_limit: 1g
    cpus: 2.0
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: ["celery", "-A", "apps.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      disable: true

  egress-proxy:
    <<: *backend
    command: ["python", "-m", "apps.worker.egress_proxy"]
    environment:
      EGRESS_PROXY_LISTEN_HOST: 0.0.0.0
      EGRESS_PROXY_LISTEN_PORT: "8888"
      EGRESS_ALLOWED_PORTS: "80,443"
    expose: ["8888"]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      disable: true

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-scrapeflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-scrapeflow-dev-secret}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks: [app_net]

  minio-init:
    <<: *backend
    command: ["python", "scripts/ensure_bucket.py"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    healthcheck:
      disable: true

  selenium:
    image: selenium/standalone-chrome:4.25.0
    shm_size: 2g
    environment:
      SE_NODE_MAX_SESSIONS: "4"
      SE_NODE_OVERRIDE_MAX_SESSIONS: "true"
      SE_NODE_SESSION_TIMEOUT: "300"
      SE_START_XVFB: "false"
      SE_START_VNC: "false"
    ports:
      - "127.0.0.1:4444:4444"
    mem_limit: 3g
    security_opt: ["no-new-privileges:true"]
    networks: [app_net]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  app_net:
    driver: bridge
